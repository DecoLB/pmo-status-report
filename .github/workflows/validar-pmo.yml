name: Validar HTML do PMO
on:
  pull_request:
    paths:
      - "index.html"
      - ".github/workflows/validar-pmo.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir HTML e extrair JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re
          source=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r'<script(?![^>]*src=)[^>]*>([\s\S]*?)</script>',source,re.I)
          assert len(scripts)==1, f"Esperado 1 JavaScript inline; encontrado {len(scripts)}"
          assert 'function carregarPortfolio()' in scripts[0]
          assert 'function salvarStatus(e)' in scripts[0]
          assert 'function carregarResumo()' in scripts[0]
          assert 'sb_secret_' not in source and 'service_role' not in source
          Path("/tmp/pmo-script.js").write_text(scripts[0],encoding="utf-8")
          class IDs(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids=[]
              def handle_starttag(self, tag, attrs):
                  self.ids += [v for k,v in attrs if k=="id"]
          parser=IDs();parser.feed(source)
          duplicados={x for x in parser.ids if parser.ids.count(x)>1}
          assert not duplicados, f"IDs duplicados: {sorted(duplicados)}"
          print(f"HTML verificado: {len(parser.ids)} IDs unicos")
          PY
      - name: Verificar sintaxe do JavaScript
        run: node --check /tmp/pmo-script.js
