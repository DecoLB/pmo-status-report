
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>PMO | Status Report</title>
  <style>
    body {
      margin: 0;
      background: #101827;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }
    header {
      background: #19263a;
      padding: 24px 40px;
      border-bottom: 3px solid #ec7900;
    }
    main {
      max-width: 1000px;
      margin: 60px auto;
      padding: 20px;
    }
    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .card {
      flex: 1 1 260px;
      padding: 30px;
      background: #1d2d43;
      border: 1px solid #34465e;
      border-radius: 12px;
    }
    .card p { color: #bdc8d8; }
  </style>
</head>
<body>
  <header>
    <h2>PMO | Status Report</h2>
  </header>

  <main>
    <h1>Gestão de Portfólio</h1>
    <p>Ambiente inicial de demonstração</p>

    <div class="cards">
      <div class="card">
        <h2>Visão Administrativa</h2>
        <p>Preenchimento dos gerentes de projetos.</p>
      </div>
      <div class="card">
        <h2>Visão Executiva</h2>
        <p>Acompanhamento e apresentação dos projetos.</p>
      </div>
    </div>
  </main>
</body>
</html>
